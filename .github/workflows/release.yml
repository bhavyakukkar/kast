name: Release
on:
  push:
    tags:
    - v*

env:
  # Preview mode: Publishes the build output as a CI artifact instead of creating
  # a release, allowing for manual inspection of the output. This mode is
  # activated if the CI run was triggered on a fork of the repository
  preview: ${{ github.repository != 'kast-lang/kast' }}

permissions: read-all

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        # intentionally not specifying ocaml compiler version here

      - name: Generate opam-file
        run: dune build kast.opam

      - name: Install Dependencies
        run: opam install . --deps-only

      - name: Build Kast
        run: opam exec -- dune build
